<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/bills.css">
</head>

<body onload="loadLayout()">

    <div id="sidebar"></div>

    <div class="main">

        <div id="navbar"></div>

        <div class="content">

            <!-- MAIN CARD -->
            <form action="" method="get">
                <div class="bill-container">

                    <!-- TOP -->
                    <div class="bill-top">

                        <div>
                            <h1>Bill Configuration</h1>
                            <p>
                                Select an apartment and define the billing particulars for the current month.
                            </p>
                        </div>

                    </div>

                    <!-- RESIDENT DETAILS -->
                    <div class="bill-section">

                        <h3>Resident Detail</h3>

                        <div class="bill-grid">

                            <div class="bill-input-group">

                                <label>Apartment / Flat *</label>

                                <select>
                                    <option>Search by flat number...</option>
                                    <option>A-302</option>
                                    <option>B-105</option>
                                    <option>C-501</option>
                                </select>

                            </div>

                            <div class="resident-info">

                                <div class="info-box">
                                    <label>Resident Name</label>
                                    <p>Noor Ali Sheikh</p>
                                </div>


                                <div class="info-box">
                                    <label>Building</label>
                                    <p>Serene Heights</p>
                                </div>


                                <div class="info-box">
                                    <label>Block</label>
                                    <p>Block A</p>
                                </div>

                                <div class="info-box">
                                    <label>Parking Slot</label>
                                    <p>B12</p>
                                </div>

                            </div>

                        </div>

                    </div>

                    <!-- BILLING -->
                    <div class="bill-section">

                        <h3>Billing Timeline</h3>

                        <div class="billing-row">

                            <div class="bill-input-group">

                                <label>Billing Month</label>

                                <input type="text" value="March 2026">

                            </div>

                            <div class="bill-input-group">

                                <label>Issue Date</label>

                                <input type="date">

                            </div>

                            <div class="bill-input-group">

                                <label>Valid Till *</label>

                                <input type="date">

                            </div>

                        </div>

                    </div>

                    <!-- CHARGES -->
                    <div class="bill-section">
                        <h3>Utilities & Service Charges</h3>

                        <div class="bill-input-group">
                            <label>Maintenance Charges *</label>
                            <input type="number" id="maintenanceCharge" value="0">
                        </div>
                    </div>

                    <!-- TOTAL -->
                    <div class="total-bill-card">
                        <div>
                            <h2>Total Bill Amount</h2>
                        </div>

                        <h2 id="totalAmount">PKR 15000</h2>
                    </div>
                    <!-- BUTTONS -->

                    <div class="bill-buttons">

                        <button class="cancel-btn" type="reset">
                            Cancel
                        </button>

                        <button class="generate-btn" type="submit">
                            Generate Bill
                        </button>

                    </div>

                </div>
            </form>

        </div>

        <div id="footer"></div>

    </div>

    <script src="../js/include.js"></script>
    <script src="../js/bills.js"></script>

</body>

</html>
